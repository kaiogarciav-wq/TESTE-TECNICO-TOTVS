<div class="error-modal-container">
    <button class="close-button" (click)="onClose()" aria-label="Fechar">&times;</button>
    <div class="icon-wrapper">
        <i class="fas fa-exclamation-circle error-icon"></i> <!-- Ícone de erro do Font Awesome -->
    </div>
    <h2 class="modal-title">Ops! Algo deu errado.</h2>
    <p class="modal-message">{{ data.message }}</p>

    <div class="modal-actions" *ngIf="data.showRetry">
        <button class="retry-button" (click)="onRetry()">Tentar Novamente</button>
    </div>
</div>
